<title id="title">Daisy clip broad-petal and idle head fit study</title>
<desc id="desc">Exploratory vector study. Three five-petal silhouettes widen their petals and inner valleys. Existing body and ear path strings are taken from the current source. Candidate idle anchors use the current head anchors. Face art is intentionally outside these head crops. This does not verify runtime attachment, other poses or native browser rendering.</desc>
