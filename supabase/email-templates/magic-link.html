<div style="margin:0;padding:24px 12px;background:#efe9ff;font-family:Nunito,'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;color:#2b1e2f;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;background:#ffffff;border:3px solid #2b1e2f;border-radius:20px;">

      <td style="padding:28px 28px 8px;text-align:center;">

      <td style="padding:20px 28px 8px;text-align:center;">

    </tr>

      </td>
